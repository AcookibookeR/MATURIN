<!DOCTYPE html>

<html>
    <head>
        <title>Cadastro Usuário</title>
    </head>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin: 10px;
            height: 100vh;
            display: flex;
            gap: 240px;
        }
        
        .sidebar{
            width: 300px;
            height: 94vh;
            background-color: #0febe7ff;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        .welcomemessage {
            font-size: 24px;
            text-align: center;
            height: 97%;
            width: 90%;
            padding: 14px;
            border-radius: 50px;
            color: black;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
        }

        h2{
            text-align: center;
            
        }

        .register {
            background-color: #0febe7ff;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            max-width: 600px;
            max-height: 450px;
            margin-top: 7%;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
        }


        .register form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .campo{
            display: flex;
            flex-direction: column;
        }

        input{
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 95%;
        }

        select{
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 98%;
        }

        button{
            margin-top: 10px;
            padding: 10px;
            border-radius: 20px;
            border: none;
            background-color: #0786a6ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 95%;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
        }
    </style>

    <body>
        <div class="container">
            <div class="sidebar">
                <div class='welcomemessage'>
                    <p><strong>Seja bem-vindo(a)! Este é seu primeiro acesso a nossa plataforma, vamos nos conhecer melhor?</strong></p>
                </div>
            </div>

            <div class="register">
                <form id="register-form" method="post">
                    {% csrf_token %}
                    <h2 id="form-title">Vamos terminar seu cadastro?</h2>

                    <div class="campo">
                        <label for="name">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                    </div>

                    <div class="endereco">
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço">
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone: </label>
                        <input type="number" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
                    </div>

                    <button type="submit" id="submit-btn">Enviar</button>
                </form>
            </div>
        </div>

    </body>

    <script>
        const URL_CADASTRO = "{% url 'cadastrar_usuario' %}";
        const form = document.getElementById("register-form");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value;
            const endereco = document.getElementById("endereco").value;
            const telefone = document.getElementById("telefone").value;

            const dados = {
                nome: nome,
                endereco: endereco,
                telefone: telefone,
            };

            enviarParaDjango(dados);
        });

        function enviarParaDjango(dados) {
            fetch(URL_CADASTRO, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCSRFToken()
                },
                body: JSON.stringify(dados)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "ok") {
                    form.reset();

                    form.innerHTML = `
                        <h2>Cadastro concluído com sucesso 🎉</h2>
                        <p>Seja bem-vindo à plataforma.</p>
                    `;
                }
            })
            .catch(error => {
                console.error("Erro:", error);
            });
        }
        function getCSRFToken() {
            return document.querySelector('[name=csrfmiddlewaretoken]').value;
        }
    </script>
</html>
