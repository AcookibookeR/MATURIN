<!DOCTYPE html>

<html>
    <head>
        <title>Gerenciamento principal</title>
        <meta charset="UTF-8">
        {% load static %}
        <link rel="icon" href="{% static 'perfil/img/image.png' %}" type='image/png'>
    </head>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin: 10px;
            height: 100vh;
            display: flex;
            gap: 240px;
        }
        
        .sidebar{
            width: 300px;
            height: 94vh;
            background-color: #0febe7ff;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        .welcomemessage {
            font-size: 24px;
            text-align: center;
            height: 97%;
            width: 90%;
            padding: 14px;
            border-radius: 50px;
            color: black;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.7;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
        }


        .nomeUser {
            display: flex;
            height: 40px;
            width: 70%;
            padding: 5px;
            background-color: purple;
            border-radius: 10px;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
            color: white;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px; /* espaço até o Perfil */
        }

        
        .selectlivro {
            margin-bottom: 5px;
            font-size: 16px;
        }

        select {
            border-radius: 8px;
            margin-bottom: 30px;
            width: 100%;
        }


        h2{
            text-align: center;
            
        }

        .livro-Container {
            background-color: #0febe7ff;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            max-width: 600px;
            max-height: 480px;
            margin-top: 5%;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
        }


        .register form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .campo{
            display: flex;
            flex-direction: column;
        }

        input{
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 95%;
        }

        button{
            margin-top: 20px;
            padding: 10px;
            border-radius: 20px;
            border: none;
            background-color: #0786a6ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 99%;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
        }
    </style>

    <body>
        <div class="container">
            <div class="sidebar">
                <div class='welcomemessage'>
                    <div class="nomeUser">{{ user.username.capitalize }}</div>

                    <label class="selectlivro">Livro</label>
                    <select id="acaoLivro">
                        <option value="">- Selecionar Ação</option>
                        <option value="cadastrar">- Cadastrar</option>
                        <option value="buscar">- Buscar</option>
                        <option value="atualizar">- Atualizar</option>
                        <option value="deletar">- Deletar</option>
                    </select>
                </div>
            </div>

            <div id="livroContainer" class="livro-Container"></div>
            
            </div>
        </div>

    </body>

    <script>
        const selectLivro = document.getElementById("acaoLivro");
        const container = document.getElementById("livroContainer");

        selectLivro.addEventListener("change", function () {
            switch (this.value) {
                case "cadastrar":
                    container.innerHTML = `<div class="register-livro">
                    <form id="register-form" method="post">
                        <h2 id="form-title">CADASTRAR LIVRO</h2>

                        <div class="isbnCadastro">
                            <label for="isbnCadastro">ISBN:</label>
                            <input type="text" id="isbnCadastro" name="isbnCadastro" placeholder="Digite o ISBN" required>
                        </div>

                        <div class="nomeCadastro">
                            <label for="nomeCadastro">Nome:</label>
                            <input type="text" id="nomeCadastro" name="nomeCadastro" placeholder="Digite o nome" required>
                        </div>

                        <div class="autorCadastro">
                            <label for="autorCadastro">Autor: </label>
                            <input type="text" id="autorCadastro" name="autorCadastro" placeholder="Digite o autor" required>
                        </div>

                        <div class="editoraCadastro">
                            <label for="editoraCadastro">Editora: </label>
                            <input type="text" id="editoraCadastro" name="editoraCadastro" placeholder="Digite a editora" required>
                        </div>

                        <div class="anoCadastro">
                            <label for="anoCadastro">Ano: </label>
                            <input type="number" id="anoCadastro" name="anoCadastro" placeholder="Digite o ano" required>
                        </div>

                        <div class="paginasCadastro">
                            <label for="paginasCadastro">Páginas: </label>
                            <input type="number" id="paginasCadastro" name="paginasCadastro" placeholder="Digite a quantidade de páginas" required>
                        </div>

                        <button type="submit" id="submitCadastro">Enviar</button>
                    </form>
                </div>`;

                const formC = document.getElementById("register-form");

                formC.addEventListener("submit", function (event) {
                    event.preventDefault();

                    const isbnC = document.getElementById("isbnCadastro").value;
                    const nomeC = document.getElementById("nomeCadastro").value;
                    const autorC = document.getElementById("autorCadastro").value;
                    const editoraC = document.getElementById("editoraCadastro").value;
                    const anoC = document.getElementById("anoCadastro").value;
                    const paginasC = document.getElementById("paginasCadastro").value;

                    const dadosC = {
                        isbn: isbnC,
                        nome: nomeC,
                        autor: autorC,
                        editora: editoraC,
                        ano: anoC,
                        total_pag: paginasC,
                    };

                    enviarParaDjangoCadastro(dadosC);
                });

                function enviarParaDjangoCadastro(dadosC) {
                    fetch(`/livro/cadastrar/`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(dadosC)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === "ok") {
                            alert("Livro cadastrado com sucesso!");
                            formC.reset();
                        }
                    })
                    .catch(error => {
                        console.error("Erro:", error);
                    });
                }
                    break;
                case "buscar":
                    container.innerHTML = `<div class="find-livro">
                        <h2 id="form-title">BUSCAR LIVRO</h2>

                        <div class="isbnBuscar">
                            <label for="isbnBuscar">ISBN:</label>
                            <input type="text" id="isbnBuscar" name="isbnBuscar" placeholder="Digite o ISBN" required>
                        </div>

                        <div class="nomeBuscar">
                            <label id="nomeBuscar"></label>
                        </div>

                        <div class="autorBuscar">
                            <label id="autorBuscar"></label>
                        </div>

                        <div class="editoraBuscar">
                            <label id="editoraBuscar"></label>
                        </div>

                        <div class="anoBuscar">
                            <label id="anoBuscar"></label>
                        </div>

                        <div class="paginasBuscar">
                            <label id="paginasBuscar"></label>
                        </div>

                        <button type="button" id="submitBuscar">Enviar</button>
                </div>`;

                const isbnInputBuscar = document.getElementById("isbnBuscar");
                const submitBtnBuscar = document.getElementById("submitBuscar");

                submitBtnBuscar.addEventListener("click", () => {
                    const isbnB = isbnInputBuscar.value.trim();
                    if (!isbnB) return;

                    fetch(`/livro/buscar/?isbn=${isbnB}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.error) {
                                alert(data.error);
                                return;
                            }

                            document.getElementById("nomeBuscar").textContent    = `Nome: ${data.nome}`;
                            document.getElementById("autorBuscar").textContent   = `Autor: ${data.autor}`;
                            document.getElementById("editoraBuscar").textContent = `Editora: ${data.editora}`;
                            document.getElementById("anoBuscar").textContent     = `Ano: ${data.ano}`;
                            document.getElementById("paginasBuscar").textContent = `Páginas: ${data.total_pag}`;
                        })
                        .catch(err => console.error("Erro no fetch:", err));
                });
                    break;
                case "atualizar":
                    container.innerHTML = `<div class="update-livro">
                    <form id="update-form" method="post">
                        <h2 id="form-title">ATUALIZAR LIVRO</h2>

                        <div class="isbnAtualizar">
                            <label for="isbnAtualizar">ISBN:</label>
                            <input type="text" id="isbnAtualizar" name="isbnAtualizar" placeholder="Digite o ISBN" required>
                        </div>

                        <div class="nomeAtualizar">
                            <label for="nomeAtualizar">Nome:</label>
                            <input type="text" id="nomeAtualizar" name="nomeAtualizar" placeholder="Digite o nome" required>
                        </div>

                        <div class="autorAtualizar">
                            <label for="autorAtualizar">Autor: </label>
                            <input type="text" id="autorAtualizar" name="autorAtualizar" placeholder="Digite o autor" required>
                        </div>

                        <div class="editoraAtualizar">
                            <label for="editoraAtualizar">Editora: </label>
                            <input type="text" id="editoraAtualizar" name="editoraAtualizar" placeholder="Digite a editora" required>
                        </div>

                        <div class="anoAtualizar">
                            <label for="anoAtualizar">Ano: </label>
                            <input type="number" id="anoAtualizar" name="anoAtualizar" placeholder="Digite o ano" required>
                        </div>

                        <div class="paginasAtualizar">
                            <label for="paginasAtualizar">Páginas: </label>
                            <input type="number" id="paginasAtualizar" name="paginasAtualizar" placeholder="Digite a quantidade de páginas" required>
                        </div>

                        <button type="submit" id="submitAtualizar">Enviar</button>
                    </form>
                </div>`;

                const formA = document.getElementById("update-form");

                formA.addEventListener("submit", function (event) {
                    event.preventDefault();

                    const isbnA = document.getElementById("isbnAtualizar").value;
                    const nomeA = document.getElementById("nomeAtualizar").value;
                    const autorA = document.getElementById("autorAtualizar").value;
                    const editoraA = document.getElementById("editoraAtualizar").value;
                    const anoA = document.getElementById("anoAtualizar").value;
                    const paginasA = document.getElementById("paginasAtualizar").value;

                    const dadosA = {
                        isbn: isbnA,
                        nome: nomeA,
                        autor: autorA,
                        editora: editoraA,
                        ano: anoA,
                        total_pag: paginasA,
                    };

                    enviarParaDjangoAtualizar(dadosA);
                });

                function enviarParaDjangoAtualizar(dadosA) {
                    fetch(`/livro/atualizar/`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(dadosA)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === "ok") {
                            alert("Livro atualizado com sucesso!");
                            formA.reset();
                        }
                    })
                    .catch(error => {
                        console.error("Erro:", error);
                    });
                }

                    break;
                case "deletar":
                    container.innerHTML = `<div class="delete-livro">
                        <h2 id="form-title">DELETAR LIVRO</h2>

                        <div class="isbnDeletar">
                            <label for="isbnDeletar">ISBN:</label>
                            <input type="text" id="isbnDeletar" name="isbnDeletar" placeholder="Digite o ISBN" required>
                        </div>

                        <button type="button" id="submitDeletar">Enviar</button>
                </div>`;

                const isbnInputDeletar = document.getElementById("isbnDeletar");
                const submitBtnDeletar = document.getElementById("submitDeletar");

                submitBtnDeletar.addEventListener("click", () => {
                    const isbnD = isbnInputDeletar.value.trim();
                    if (!isbnD) return;

                    fetch("/livro/deletar/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ isbn: isbnD })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.error) {
                            alert(data.error);
                        } else if (data.status === "ok") {
                            alert("Livro deletado com sucesso!");
                            isbnInputDeletar.value = "";
                        }
                    })
                    .catch(err => console.error("Erro no fetch:", err));
                });
                    break;
                default:
                    container.innerHTML = "";
            }
        });
    </script>
</html>
