<!DOCTYPE html>

<html>
    <head>
        <title>Gerenciamento principal</title>
    </head>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin: 10px;
            height: 100vh;
            display: flex;
            gap: 240px;
        }
        
        .sidebar{
            width: 300px;
            height: 94vh;
            background-color: #0febe7ff;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        .welcomemessage {
            font-size: 24px;
            text-align: center;
            height: 97%;
            width: 90%;
            padding: 14px;
            border-radius: 50px;
            color: black;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.7;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
        }


        .nomeUser {
            display: flex;
            height: 40px;
            width: 70%;
            padding: 5px;
            background-color: purple;
            border-radius: 10px;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
            color: white;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px; /* espaço até o Perfil */
        }

        
        .selectperfil , .selectlivro {
            margin-bottom: 5px;
            font-size: 16px;
        }

        select {
            border-radius: 8px;
            margin-bottom: 30px;
            width: 100%;
        }


        h2{
            text-align: center;
            
        }

        .livro-Container {
            background-color: #0febe7ff;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            max-width: 600px;
            max-height: 480px;
            margin-top: 5%;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
        }


        .register form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .campo{
            display: flex;
            flex-direction: column;
        }

        input{
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 95%;
        }

        button{
            margin-top: 20px;
            padding: 10px;
            border-radius: 20px;
            border: none;
            background-color: #0786a6ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 99%;
            font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
        }
    </style>

    <body>
        <div class="container">
            <div class="sidebar">
                <div class='welcomemessage'>
                    <div class="nomeUser">{{ user.username.capitalize }}</div>

                    <label class="selectperfil">Perfil</label>
                    <select>
                        <option>- Ver Perfil</option>
                        <option>- Post</option>
                    </select>

                    <label class="selectlivro">Livro</label>
                    <select id="acaoLivro">
                        <option value="">- Selecionar Ação</option>
                        <option value="cadastrar">- Cadastrar</option>
                        <option value="buscar">- Buscar</option>
                        <option value="atualizar">- Atualizar</option>
                        <option value="deletar">- Deletar</option>
                    </select>
                </div>
            </div>

            <div id="livroContainer" class="livro-Container"></div>
            
            </div>
        </div>

    </body>

    <script>
        const selectLivro = document.getElementById("acaoLivro");
        const container = document.getElementById("livroContainer");

        selectLivro.addEventListener("change", function () {
            switch (this.value) {
                case "cadastrar":
                    container.innerHTML = `<div class="register-livro">
                    <form id="register-form" method="post">
                        {% csrf_token %}
                        <h2 id="form-title">CADASTRO LIVRO</h2>

                        <div class="isbn">
                            <label for="isbn">ISBN:</label>
                            <input type="text" id="isbn" name="isbn" placeholder="Digite o ISBN" required>
                        </div>

                        <div class="nome">
                            <label for="nome">Nome:</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite o nome" required>
                        </div>

                        <div class="autor">
                            <label for="autor">Autor: </label>
                            <input type="text" id="autor" name="autor" placeholder="Digite o autor" required>
                        </div>

                        <div class="editora">
                            <label for="editora">Editora: </label>
                            <input type="text" id="editora" name="editora" placeholder="Digite a editora" required>
                        </div>

                        <div class="ano">
                            <label for="ano">Ano: </label>
                            <input type="number" id="ano" name="ano" placeholder="Digite o ano" required>
                        </div>

                        <div class="paginas">
                            <label for="paginas">Páginas: </label>
                            <input type="number" id="paginas" name="paginas" placeholder="Digite a quantidade de páginas" required>
                        </div>

                        <button type="submit" id="submit-btn">Enviar</button>
                    </form>
                </div>`;

                const URL_CADASTRO = "{% url 'cadastrar_livro' %}";
                const form = document.getElementById("register-form");

                form.addEventListener("submit", function (event) {
                    event.preventDefault();

                    const isbn = document.getElementById("isbn").value;
                    const nome = document.getElementById("nome").value;
                    const autor = document.getElementById("autor").value;
                    const editora = document.getElementById("editora").value;
                    const ano = document.getElementById("ano").value;
                    const paginas = document.getElementById("paginas").value;

                    const dados = {
                        isbn: isbn,
                        nome: nome,
                        autor: autor,
                        editora: editora,
                        ano: ano,
                        total_pag: paginas,
                    };

                    enviarParaDjango(dados);
                });

                function enviarParaDjango(dados) {
                    fetch(URL_CADASTRO, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": getCSRFToken()
                        },
                        body: JSON.stringify(dados)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === "ok") {
                            form.reset();

                            form.innerHTML = `
                                <h2>Cadastro concluído com sucesso 🎉</h2>
                            `;
                        }
                    })
                    .catch(error => {
                        console.error("Erro:", error);
                    });
                }
                function getCSRFToken() {
                    return document.querySelector('[name=csrfmiddlewaretoken]').value;
                }
                    break;
                case "buscar":
                    container.innerHTML = `
                    
                    
                    
                    
                    `;
                    break;
                case "atualizar":
                    container.innerHTML = `<h2>Att Livro</h2>`;
                    break;
                case "deletar":
                    container.innerHTML = `<h2>Del Livro</h2>`;
                    break;
                default:
                    container.innerHTML = "";
            }
        });

        
    </script>
</html>
